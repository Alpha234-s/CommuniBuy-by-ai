services:
  app:
    profiles: [demo, proxy]
    build: .
    image: communibuy:${APP_VERSION:-local}
    environment:
      DB_URL: jdbc:mysql://mysql:3306/communibuy?allowPublicKeyRetrieval=true&useSSL=false
      DB_USER: communibuy
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      SPRING_PROFILES_ACTIVE: ${APP_PROFILES:-local}
      PAYMENT_MODE: ${PAYMENT_MODE:-disabled}
      PAYMENT_SIM_SECRET: ${PAYMENT_SIM_SECRET:-}
      PAYMENT_MERCHANT: ${PAYMENT_MERCHANT:-communibuy-demo}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      REVOCATION_CLEANUP_ENABLED: ${REVOCATION_CLEANUP_ENABLED:-true}
      REVOCATION_CLEANUP_DELAY_MS: ${REVOCATION_CLEANUP_DELAY_MS:-60000}
      REVOCATION_CLEANUP_BATCH_SIZE: ${REVOCATION_CLEANUP_BATCH_SIZE:-500}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  proxy:
    profiles: [proxy]
    image: nginx:1.28.0-alpine
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
  mysql:
    image: mysql:8.4.6
    environment:
      MYSQL_DATABASE: communibuy
      MYSQL_USER: communibuy
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set a separate MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - communibuy-db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=TCP -h127.0.0.1 -u$$MYSQL_USER -e 'SELECT 1' $$MYSQL_DATABASE"]
      interval: 5s
      timeout: 5s
      retries: 40
volumes:
  communibuy-db:
