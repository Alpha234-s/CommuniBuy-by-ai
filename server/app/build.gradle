plugins {
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java'
    id 'jacoco'
}
group = 'hy.CommunityBuy'
version = '0.1.0'
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
repositories { mavenCentral() }
dependencyLocking { lockAllConfigurations() }
dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'
    runtimeOnly 'com.mysql:mysql-connector-j'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:mysql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.withType(Test).configureEach {
    useJUnitPlatform()
    // Database state and runtime configuration are external inputs: never reuse test success.
    outputs.upToDateWhen { false }
    outputs.cacheIf { false }
    testLogging { events 'passed', 'skipped', 'failed'; exceptionFormat 'short' }
    // Integration tests fail if neither Docker nor an explicitly isolated MySQL is available.
    environment 'TEST_DB_URL', System.getenv('TEST_DB_URL') ?: ''
}
bootJar { archiveFileName = 'communibuy.jar' }
jar { enabled = false }
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

jacoco { toolVersion = '0.8.15' }
tasks.named('jacocoTestReport') {
    dependsOn test
    reports { xml.required = true; html.required = true }
}
tasks.named('test') { finalizedBy jacocoTestReport }

configurations { formatter }
dependencies { formatter 'com.google.googlejavaformat:google-java-format:1.28.0:all-deps' }
def configureFormatter = { task, replace ->
    task.classpath = configurations.formatter
    task.mainClass = 'com.google.googlejavaformat.java.Main'
    task.javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    task.jvmArgs = ['api', 'file', 'parser', 'tree', 'util', 'code'].collect { '--add-exports=jdk.compiler/com.sun.tools.javac.' + it + '=ALL-UNNAMED' }
    task.args = (replace ? ['--replace'] : ['--dry-run', '--set-exit-if-changed']) + fileTree('src').matching { include '**/*.java' }.files.sort().collect { it.absolutePath }
}
tasks.register('formatJava', JavaExec) { configureFormatter(delegate, true) }
tasks.register('formatCheck', JavaExec) { configureFormatter(delegate, false) }
tasks.named('check') { dependsOn formatCheck }
tasks.withType(JavaCompile).configureEach { options.compilerArgs += ['-Xlint:unchecked', '-Werror'] }
