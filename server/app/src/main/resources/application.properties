spring.application.name=communibuy
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.baseline-on-migrate=false
spring.sql.init.mode=never
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-null-for-primitives=true
spring.jackson.deserialization.accept-float-as-int=false
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=communibuy
app.jwt.audience=communibuy-api
app.jwt.ttl-seconds=${JWT_TTL_SECONDS:3600}
app.orders.payment-timeout-seconds=${PAYMENT_TIMEOUT_SECONDS:900}
app.orders.sweep-delay-ms=${ORDER_SWEEP_DELAY_MS:60000}
app.auth.legacy-password-login=${LEGACY_PASSWORD_LOGIN:false}
