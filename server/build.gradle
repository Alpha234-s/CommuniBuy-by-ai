plugins {
}

repositories {
    mavenCentral()
}

allprojects {
    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
    }
    tasks.withType(GroovyCompile) {
        options.encoding = 'UTF-8'
    }
    tasks.withType(Test) {
        systemProperty 'file.encoding', 'UTF-8'
    }
    tasks.withType(JavaExec) {
        systemProperty 'file.encoding', 'UTF-8'
    }
}

tasks.register("postBuildScripts", Exec) {
    workingDir = project.rootDir
    def isWindows = System.properties["os.name"]
        .toLowerCase(Locale.ROOT)
        .contains("windows")
    def pyPath = isWindows ? "python.exe" : "python3"
    def fixJarTime = file("scripts/fix_jar_time.py")
    doFirst {
        commandLine pyPath, fixJarTime
    }
}

tasks.register("build").configure {
    dependsOn subprojects.collect {
        subproject -> subproject.tasks.matching {
            task -> task.name == "build"
        }
    }
    doLast {
        def reportsDir = file("build/reports")
        if (reportsDir.exists()) {
            reportsDir.deleteDir()
        }
        def outputDir = file("build/outputs")
        if (outputDir.exists()) {
            outputDir.deleteDir()
        }
        outputDir.mkdirs()
        def outputFiles = file("app/build/libs")
        if (outputFiles.exists() && outputFiles.isDirectory()) {
            copy {
                from outputFiles
                into outputDir
                include "**/*"
            }
        }
    }
    finalizedBy "postBuildScripts"
}

dependencies {
}
