spring.application.name=communibuy
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.baseline-on-migrate=false
spring.sql.init.mode=never
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-null-for-primitives=true
spring.jackson.deserialization.accept-float-as-int=false
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=communibuy
app.jwt.audience=communibuy-api
app.jwt.ttl-seconds=${JWT_TTL_SECONDS:3600}
app.orders.payment-timeout-seconds=${PAYMENT_TIMEOUT_SECONDS:900}
app.orders.sweep-delay-ms=${ORDER_SWEEP_DELAY_MS:60000}
app.auth.legacy-password-login=${LEGACY_PASSWORD_LOGIN:false}
app.auth.revocation-cleanup.enabled=${REVOCATION_CLEANUP_ENABLED:true}
app.auth.revocation-cleanup.delay-ms=${REVOCATION_CLEANUP_DELAY_MS:60000}
app.auth.revocation-cleanup.batch-size=${REVOCATION_CLEANUP_BATCH_SIZE:500}

logging.pattern.level=%5p [traceId=%X{traceId}]
# Database errors/bind values can contain private data. ApiErrors emits structural diagnostics.
spring.jpa.show-sql=false
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
spring.profiles.default=local
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.connection-timeout=10000
springdoc.swagger-ui.enabled=${API_UI_ENABLED:false}

app.payment.mode=${PAYMENT_MODE:disabled}
app.payment.simulator-secret=${PAYMENT_SIM_SECRET:}
app.payment.merchant=${PAYMENT_MERCHANT:communibuy-demo}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
management.metrics.tags.application=communibuy
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
app.rate-limits.enabled=${RATE_LIMITS_ENABLED:true}
